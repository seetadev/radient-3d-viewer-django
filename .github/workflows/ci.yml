name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: ci-only-not-a-real-key
  DJANGO_ALLOWED_HOSTS: localhost

jobs:
  unit:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -W error manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: manage.py check --deploy is clean (production env, generated throwaway key)
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(60))')"
          DJANGO_ALLOWED_HOSTS=viewer.example.org DJANGO_TRUST_PROXY_SSL=1 \
            python manage.py check --deploy --fail-level WARNING
      - run: pytest -v

  e2e:
    name: Playwright browser flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: npm ci
      - run: npm audit

  docker:
    name: docker build + container browser flow
    runs-on: ubuntu-latest
    env:
      HOST_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and start (waits for the healthcheck)
        run: docker compose up -d --build --wait
      - name: Container runs as non-root with a read-only filesystem
        run: |
          test "$(docker compose exec -T web id -u)" != "0"
          ! docker compose exec -T web sh -c 'touch /app/x'
      - name: Static assets are served compressed with the right MIME type
        run: |
          for p in /static/models/elephant.glb /static/vendor/three/build/three.core.js; do
            curl -s -D- -o /dev/null -H 'Accept-Encoding: gzip' "http://localhost:8000$p" | grep -i 'content-encoding: gzip'
          done
          curl -s -D- -o /dev/null http://localhost:8000/static/models/spacesuit.glb | grep -i 'content-type: model/gltf-binary'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against the container
        run: E2E_NO_SERVER=1 E2E_PORT=8000 npx playwright test
      - name: Container logs
        if: failure()
        run: docker compose logs
      - run: docker compose down
      - name: Production env behaves as documented (HTTPS-only, proxy trust, opt-in HSTS)
        run: |
          export DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_ALLOWED_HOSTS=viewer.example.org,localhost DJANGO_HTTPS_ONLY=1 DJANGO_TRUST_PROXY_SSL=1
          proxied() { curl -s -D- -o /dev/null -H 'Host: viewer.example.org' -H 'X-Forwarded-Proto: https' http://localhost:8000/; }
          docker compose up -d --wait
          curl -s -D- -o /dev/null -H 'Host: viewer.example.org' http://localhost:8000/ | grep -E '^HTTP/.* 301'   # plain http -> redirect
          proxied | grep -E '^HTTP/.* 200'
          ! proxied | grep -i strict-transport-security
          docker compose down
          DJANGO_HSTS_SECONDS=3600 docker compose up -d --wait
          proxied | grep -ix 'Strict-Transport-Security: max-age=3600.*' | grep -vi includesubdomains
          docker compose down
          DJANGO_HSTS_SECONDS=3600 DJANGO_HSTS_INCLUDE_SUBDOMAINS=1 docker compose up -d --wait
          proxied | grep -i 'strict-transport-security: max-age=3600; includeSubDomains'
          docker compose down
