{% load static %}<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radient 3d Viewer</title>
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet"/>
    <link href="{% static 'custom-slider.css' %}" rel="stylesheet"/>
    <link href="{% static 'styles.css' %}" rel="stylesheet"/>
    <script type="importmap">
    {
      "imports": {
        "three": "{% static 'vendor/three/build/three.module.js' %}",
        "three/addons/": "{% static 'vendor/three/addons/' %}"
      }
    }
    </script>
    <script type="module" src="{% static 'app.js' %}"></script>
</head>
<body>
    <div id="main-container" class="container">
        <h3 id="page-header">RADIENT 3D VIEWER</h3>
        <div id="main" class="col-lg-12">
            <div id="files-btn-group" class="btn-group" role="group" aria-label="...">
              <button type="button" class="model-btn btn btn-outline-secondary active">spacesuit</button>
              <button type="button" class="model-btn btn btn-outline-secondary">lamborghini</button>
              <button type="button" class="model-btn btn btn-outline-secondary">leeperrysmith</button>
              <button type="button" class="model-btn btn btn-outline-secondary">factory</button>
              <button type="button" class="model-btn btn btn-outline-secondary">elephant</button>
            </div>
            <div id="load-status">Loading your model, please wait...</div>
            <div id="viewer-container" class="row" data-models-url="{% static 'models/' %}" data-static-url="{% static '' %}">
                <div id="viewer-overlay" class="viewer-overlay active">
                    <div id="controls">
                        <div class="control-header">CAMERA</div>
                        <div class="range-control-container">
                            <div class="range-label">NEAR</div>
                            <div class="range-container">
                                <input id="camera-distance" class="range-slider" type="range"/>
                            </div>
                            <div class="range-label">FAR</div>
                        </div>
                        <div class="range-control-container">
                            <div class="range-label">
                                LOW
                            </div>
                            <div class="range-container">
                                <input id="camera-height" type="range"/>
                            </div>
                            <div class="range-label">
                                HIGH
                            </div>
                        </div>
                        <div class="range-control-container">
                            <div class="range-label">
                                0&#176
                            </div>
                            <div class="range-container">
                                <input id="camera-degree" type="range" min="1" max="360" value="45"/>
                            </div>
                            <div class="range-label">
                                360&#176
                            </div>
                        </div>
                        <div class="control-header">LIGHT</div>
                        <div class="range-control-container">
                            <div class="range-label">
                                -X
                            </div>
                            <div class="range-container">
                                <input id="pointLight-x" type="range" min="-600" max="600" value="200"/>
                            </div>
                            <div class="range-label">
                                +X
                            </div>
                        </div>

                        <div class="range-control-container">
                            <div class="range-label">
                                -Y
                            </div>
                            <div class="range-container">
                                <input id="pointLight-y" type="range" min="-600" max="600" value="200"/>
                            </div>
                            <div class="range-label">
                                +Y
                            </div>
                        </div>

                        <div class="range-control-container">
                            <div class="range-label">
                                -Z
                            </div>
                            <div class="range-container">
                                <input id="pointLight-z" type="range" min="-600" max="600" value="200"/>
                            </div>
                            <div class="range-label">
                                +Z
                            </div>
                        </div>
                    </div>

                    <div id="move-controls">
                        <div class="control-header">MODEL</div>
                        <div class="move-controls-container">
                            <button id="move-mesh-up" data-move="UP">&#9650</button>
                            <button id="move-mesh-down" data-move="DOWN">&#9660</button>
                            <button id="move-mesh-left" data-move="LEFT">&#9664</button>
                            <button id="move-mesh-right" data-move="RIGHT">&#9654</button>
                            <button id="move-mesh-front" data-move="FRONT">&#8659</button>
                            <button id="move-mesh-back" data-move="BACK">&#8657</button>
                        </div>
                    </div>
                    <input id="hex-color" type="color" value="#a1b2ab" aria-label="Model color"/>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
